{% extends "base.html" %}
{% block content %}
  <section class="grid two-up">
    <div class="panel center">
      <h3>Join the wifi</h3>
      {% if wifi_qr_data_url %}
        <img class="qr" src="{{ wifi_qr_data_url }}" alt="QR code to join wifi">
      {% else %}
        <div class="muted">Wi-Fi QR unavailable on this device.</div>
      {% endif %}
      <p class="plain-url">{{ wifi_ssid or "No SSID detected" }}</p>
    </div>

    <div class="panel center">
      <h3>Join the game</h3>
      <img class="qr" src="{{ qr_data_url }}" alt="QR code to log in">
      <p class="plain-url">{{ login_url }}</p>
    </div>
  </section>
{% endblock %}

{% extends "base.html" %}
{% block content %}
  <div class="user-brand">
    <img class="user-brand-logo" src="{{ url_for('static', filename='images/brackidearing-logo.png') }}" alt="BRACK IDEA RING">
  </div>
  <section class="auth-card panel narrow">
    <h2>Log in to join!</h2>
    <form method="post" action="{{ url_for('user_login') }}" class="stack gap-sm">
      <label>Name</label>
      <input name="name" placeholder="Your name" autocomplete="name" required>
      <label>Leader type</label>
      <select name="leader_type">
        <option value="">Choose a leader type</option>
        {% for option in leader_type_options %}
          <option value="{{ option }}">{{ option }}</option>
        {% endfor %}
      </select>
      <label>Site</label>
      <select name="site">
        <option value="">Choose a site</option>
        {% for option in site_options %}
          <option value="{{ option }}">{{ option }}</option>
        {% endfor %}
      </select>
      <button type="submit">Continue</button>
    </form>
  </section>
{% endblock %}

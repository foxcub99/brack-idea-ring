{% extends "base.html" %}
{% block content %}
  <section class="hero">
    <div>
      <h2>{{ game.stage_label() }} Stage</h2>
      <p>Team: {{ team.name if team else "Unassigned" }} · Site: {{ leader.site or "Not set" }} · Leader type: {{ leader.type or "Not set" }}</p>
    </div>
    <form method="post" action="{{ url_for('user_logout') }}">
      <button class="secondary" type="submit">Log out</button>
    </form>
  </section>
{% endblock %}
